<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>말씀을 잇다 · 성경 읽기 문제은행</title><link rel="stylesheet" href="reading-bank.css"></head>
<body><div class="wrap"><header><a class="back" href="index.html" data-i18n="back">← 성경퀴즈</a><span class="mark">BIBLE QUIZ / READ & DISCOVER</span>
<section class="startup" aria-label="Language and question format">
<div class="field"><label for="language" data-i18n="language">시작 언어</label><select id="language"><option value="ko">한글</option><option value="en">English</option><option value="ms">Bahasa Melayu</option></select></div>
<div class="field"><label for="format" data-i18n="format">문제 형식</label><select id="format"><option value="multiple_choice" data-i18n="multiple_choice">객관식</option><option value="short_answer" data-i18n="short_answer">주관식</option><option value="mixed" selected data-i18n="mixed">혼합식</option></select></div>
</section>
<h1 data-i18n="heading">문제 너머, 말씀을 만나는 시간.</h1><p data-i18n="intro"></p><p id="summary" class="stats"></p></header>
<main><section class="filters" aria-label="Question filters">
<div class="field"><label for="book" data-i18n="book"></label><select id="book"><option value="" data-i18n="allBooks"></option></select></div>
<div class="field"><label for="theme" data-i18n="theme"></label><select id="theme"><option value="" data-i18n="allThemes"></option></select></div>
<div class="field"><label for="difficulty" data-i18n="difficulty"></label><select id="difficulty"><option value="" data-i18n="allLevels"></option><option value="easy" data-i18n="easy"></option><option value="medium" data-i18n="medium"></option><option value="hard" data-i18n="hard"></option></select></div>
<div class="field"><label for="origin" data-i18n="origin"></label><select id="origin"><option value="new" data-i18n="newOnly"></option><option value="" data-i18n="allBank"></option><option value="legacy_curated" data-i18n="legacy"></option></select></div>
<div class="field"><label for="mode" data-i18n="mode"></label><select id="mode"><option value="all" data-i18n="free"></option><option value="mcheyne" data-i18n="mcheyne"></option></select></div>
<div class="field" id="dateField" hidden><label for="date" data-i18n="date"></label><input type="date" id="date"><small data-i18n="leap"></small></div>
<div class="field"><label for="count" data-i18n="count"></label><select id="count"><option value="5">5</option><option value="10" selected>10</option><option value="20">20</option></select></div>
<div class="field"><label for="source" data-i18n="source"></label><select id="source"><option value="online" data-i18n="online"></option><option value="local" data-i18n="local"></option></select></div>
<div class="filter-footer"><p id="pool" role="status"></p><button id="start" class="primary" data-i18n="start"></button></div></section>
<section id="daily" class="daily" hidden><h2 data-i18n="daily"></h2><div id="dailyReadings"></div><p data-i18n="dailyHint"></p></section>
<p id="status" role="status" aria-live="polite"></p><p id="formatNotice" class="hint" hidden data-i18n="mixedNotice"></p>
<section id="card" class="card" hidden aria-label="Current question"><div class="card-top"><span id="badge"></span><span id="progress"></span></div><p id="connection" class="connection"></p><h2 id="prompt" tabindex="-1"></h2><div id="references" class="references"></div><p id="questionHint" class="hint"></p><div id="choices" class="choices"></div><textarea id="thought" rows="3"></textarea><button id="reveal" class="primary" data-i18n="reveal"></button><p id="feedback" role="status" aria-live="polite"></p><div id="answer" class="answer" hidden><p class="eyebrow" data-i18n="answerHeading"></p><h3 id="answerText"></h3><p id="explanation"></p><p id="selfCheck" class="hint" data-i18n="selfCheck"></p></div><button id="next" class="next" hidden data-i18n="next"></button></section>
<section id="empty" class="empty"><h2 data-i18n="emptyTitle"></h2><p data-i18n="emptyHint"></p></section>
<footer><a href="NEW_QUESTIONS_KO.md" data-i18n="downloadQuestions"></a><a href="bank.json" download data-i18n="downloadJSON"></a><a href="https://github.com/juinmanin/bible-quiz-bank" target="_blank" rel="noopener noreferrer" data-i18n="github"></a><p data-i18n="footer"></p><p id="translationNote" data-i18n="translationNote" hidden></p></footer></main></div>
<script src="readingBank.generated.js"></script><script src="reading-bank-core.js"></script><script src="reading-bank-i18n.js"></script><script src="reading-bank-translations.generated.js"></script><script src="reading-bank-config.js"></script><script src="reading-bank-ui.js"></script></body></html>
